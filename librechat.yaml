version: 1.3.5
cache: true

# MVP UI lockdown — see docs/LibreChat/widget-map.md for what each
# toggle controls. `bookmarks` is the only widget kept on alongside
# the model selector; it pairs with ALLOW_SHARED_LINKS for
# tag-and-share. The composer "Tools" dropdown disappears entirely
# because all five tool-rows are off (runCode/webSearch/fileSearch/
# skills/mcpServers). `customWelcome` is intentionally unset so the
# default time-of-day + user-name greeting takes over.
interface:
  modelSelect: true
  bookmarks: true
  parameters: false
  presets: false
  memories: false
  multiConvo: false
  temporaryChat: false
  fileCitations: false
  runCode: false
  webSearch: false
  fileSearch: false
  prompts:
    use: false
    create: false
  agents:
    use: false
    create: false
  skills:
    use: false
    create: false
  mcpServers:
    use: false
    create: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  remoteAgents:
    use: false

endpoints:
  custom:
    # The Cursor adapter runs as a sibling compose service (`adapter`),
    # so DNS-by-name resolves intra-network without host.docker.internal.
    # `apiKey` is a placeholder the adapter ignores — workspace-level
    # access is controlled by the manifest registry, not per-request
    # bearer tokens.
    #
    # The `headers:` block forwards LibreChat's body fields as request
    # headers so the adapter can map LibreChat conversationId → Cursor
    # agentId for `Agent.resume`. Placeholder syntax is LibreChat's
    # built-in body-field substitution (see
    # `packages/api/src/utils/env.ts` upstream). The allowed body
    # fields are `conversationId`, `messageId`, `parentMessageId`.
    #
    # `models.fetch: true` makes LibreChat query the adapter's
    # `/v1/models` so adding a workspace (drop a manifest + restart
    # the adapter container) doesn't require editing this file.
    - name: "Cursor Workspaces"
      apiKey: "unused"
      baseURL: "http://adapter:8080/v1"
      headers:
        X-LibreChat-Conversation-Id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"
        X-LibreChat-Message-Id: "{{LIBRECHAT_BODY_MESSAGEID}}"
        X-LibreChat-Parent-Message-Id: "{{LIBRECHAT_BODY_PARENTMESSAGEID}}"
      models:
        default:
          - "cmu-genai-v1"
          - "cmu-llm-systems-v1"
          - "cursor-cookbook-v1"
        fetch: true
      titleConvo: true
      titleModel: "cmu-genai-v1"
      # gpt-5.5-extra-high-fast rejects sampling params — strip them
      # on the wire. Smoking-gun consume site:
      # ../LibreChat/packages/api/src/endpoints/openai/transform.ts:114-127
      dropParams:
        - "temperature"
        - "top_p"
        - "presence_penalty"
        - "frequency_penalty"
        - "max_tokens"
        - "stop"
        - "user"
